name: Supabase keep-alive

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check Supabase auth health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [[ -z "$SUPABASE_URL" ]]; then
            echo "SUPABASE_URL secret not set — skip"
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "${SUPABASE_URL%/}/auth/v1/health")
          echo "auth/v1/health HTTP $code"
          if [[ "$code" == "000" ]]; then
            echo "Supabase unreachable"
            exit 1
          fi

      - name: Check Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "SUPABASE_URL or SUPABASE_ANON_KEY not set — skip REST ping"
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/")
          echo "rest/v1 HTTP $code"
          if [[ "$code" == "000" ]]; then
            echo "Supabase REST unreachable"
            exit 1
          fi

      - name: Optional Postgres ping
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "DATABASE_URL not set — skip DB ping"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
          psql "$DATABASE_URL" -c "SELECT 1 AS ok;" -t -A
